<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Timetravel · Meet the crew</title>
  <style>
    [hidden] {
      display: none !important;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #142522;
      color: #eef1dc;
      font: 14px system-ui;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100vh;
    }
    header {
      position: absolute;
      left: 5%;
      top: 5%;
      pointer-events: none;
    }
    h1 {
      font-weight: 500;
      letter-spacing: -2px;
      font-size: 40px;
      margin: 10px 0;
    }
    small {
      color: #c3d897;
      letter-spacing: 3px;
      font-size: 11px;
    }
    p {
      color: #aec5ba;
    }
    footer {
      position: absolute;
      bottom: 5%;
      left: 5%;
      right: 5%;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    button,
    select,
    a {
      border: 1px solid #60776b;
      border-radius: 6px;
      padding: 10px 18px;
      background: #1d352e;
      color: #e8efdb;
      font: inherit;
      text-decoration: none;
    }
    button {
      cursor: pointer;
    }
    .names {
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: 20%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      font-size: 17px;
    }
    .names span {
      display: block;
      color: #b2c6b9;
      font-size: 11px;
      margin-top: 5px;
    }
    #stats {
      margin-left: auto;
      color: #b8cfbe;
      font-size: 11px;
    }
  </style>
  <header>
    <small>TIMETRAVEL · THE CLEARING</small>
    <h1>Meet the crew.</h1>
    <p>Human proportions. Individual faces. A world in motion.</p>
  </header>
  <canvas aria-label="Human crew preview"></canvas>
  <div class="names">
    <div style="color: #64f8da">Mira<span>ARCHITECT</span></div>
    <div style="color: #ffb36e">Ash<span>SALVAGER</span></div>
    <div style="color: #7fbeff">Tess<span>MASON</span></div>
    <div style="color: #ffa4d4">Rue<span>RECYCLER</span></div>
  </div>
  <footer>
    <select aria-label="Activity">
      <option>Idle</option>
      <option>Walking</option>
      <option>Carrying</option>
      <option>Working</option>
      <option>Celebrating</option></select
    ><button id="pause">Pause animation</button
    ><button id="angle">Turn around</button
    ><button id="close">Faces up close</button
    ><a href="/">Enter the clearing ↗</a><span id="stats"></span>
  </footer>
  <script type="module">
    import * as THREE from "three";
    import { createHuman, poseHuman } from "/src/humans.ts";
    import { actor, WorkerTask } from "/src/model.ts";
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#142522");
    const camera = new THREE.PerspectiveCamera(
      32,
      innerWidth / innerHeight,
      0.01,
      100,
    );
    const renderer = new THREE.WebGLRenderer({
      canvas: document.querySelector("canvas"),
      antialias: true,
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    scene.add(new THREE.HemisphereLight("#f7eddf", "#627767", 2.4));
    const sun = new THREE.DirectionalLight("#fff0dd", 2.2);
    sun.position.set(-3, 6, -4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);
    const rim = new THREE.DirectionalLight("#99cabc", 2);
    rim.position.set(3, 3, 3);
    scene.add(rim);
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: "#233b32", roughness: 1 }),
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0.016;
    ground.receiveShadow = true;
    scene.add(ground);
    const people = [2, 3, 4, 5].map((id, i) => {
      const a = actor(id, "worker", 0, 0, 0),
        h = createHuman(a);
      h.root.position.x = (1.5 - i) * 1.2;
      scene.add(h.root);
      return { a, h };
    });
    let paused = false,
      angle = 0,
      close = false,
      tick = 0,
      previous = performance.now(),
      fps = 60;
    function view() {
      camera.position.set(0, close ? 1.57 : 2.03, close ? -2.05 : -6.6);
      camera.lookAt(0, close ? 1.58 : 0.99, 0);
    }
    view();
    document.querySelector("#pause").onclick = () => {
      paused = !paused;
      document.querySelector("#pause").textContent = paused
        ? "Resume animation"
        : "Pause animation";
    };
    document.querySelector("#angle").onclick = () => {
      angle += Math.PI / 2;
    };
    document.querySelector("#close").onclick = () => {
      close = !close;
      people.forEach(
        ({ h }, i) => (h.root.position.x = (1.5 - i) * (close ? 0.39 : 1.2)),
      );
      document.querySelector(".names").hidden = close;
      document.querySelector("#close").textContent = close
        ? "Full figures"
        : "Faces up close";
      view();
    };
    function render(now) {
      const dt = Math.min((now - previous) / 1000, 0.1);
      previous = now;
      if (!paused) tick += dt * 60;
      fps = fps * 0.97 + 0.03 / (dt || 1 / 60);
      const mode = document.querySelector("select").value;
      for (const { a, h } of people) {
        a.moving = mode === "Walking" || mode === "Carrying";
        a.cargo = mode === "Carrying" ? 3 : 0;
        a.task =
          mode === "Working"
            ? WorkerTask.Build
            : mode === "Celebrating"
              ? WorkerTask.Celebrate
              : WorkerTask.Patrol;
        a.taskUntil = mode === "Working" ? tick + 60 : 0;
        h.root.rotation.y = angle;
        poseHuman(h, a, tick);
      }
      renderer.render(scene, camera);
      document.querySelector("#stats").textContent =
        `${Math.round(fps)} fps · ${renderer.info.render.triangles.toLocaleString()} triangles`;
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</html>
